trigger:
- main
- test

pr:
- main
- test

pool:
  name: 'Default'

variables:
- group: budget-tracker-secrets
- name: npm_config_cache
  value: $(Pipeline.Workspace)/.npm
- name: PIP_CACHE_DIR
  value: $(Pipeline.Workspace)/.pip

stages:

# ── STAGE 1: TEST & LINT ──────────────────────────────────────────────────────
- stage: Test
  displayName: 'Test & Lint'
  jobs:
  - job: Frontend_Test
    displayName: 'Frontend — Lint'
    steps:
    - task: Cache@2
      inputs:
        key: 'npm | "$(Agent.OS)" | app-frontend/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache)
      displayName: 'Cache npm'
    - script: |
        cd app-frontend
        npm ci
        npm run lint
      displayName: 'Install & Lint'

  - job: Backend_Test
    displayName: 'Backend — Check & Test'
    steps:
    - task: Cache@2
      inputs:
        key: 'pip | "$(Agent.OS)" | backend/requirements.txt'
        restoreKeys: 'pip | "$(Agent.OS)"'
        path: $(PIP_CACHE_DIR)
      displayName: 'Cache pip'
    - script: |
        python3 -m venv backend/venv
        source backend/venv/bin/activate
        pip install --cache-dir $(PIP_CACHE_DIR) -r backend/requirements.txt
      displayName: 'Install dependencies'
    - script: |
        source backend/venv/bin/activate
        cd backend
        python manage.py check
        python manage.py test
      displayName: 'Django Check & Run Tests'
      env:
        DJANGO_SECRET_KEY: $(DJANGO_SECRET_KEY)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        GOOGLE_SECRET: $(GOOGLE_SECRET)
        POSTGRES_DB: $(POSTGRES_DB)
        POSTGRES_USER: $(POSTGRES_USER)
        POSTGRES_PASSWORD: $(POSTGRES_PASSWORD)
        POSTGRES_HOST: $(POSTGRES_HOST)
        POSTGRES_PORT: $(POSTGRES_PORT)


# ── STAGE 2: DEPLOY (BUILD & PUSH DOCKER IMAGES) ──────────────────────────────
- stage: Deploy
  displayName: 'Build & Push Docker Images'
  dependsOn: Test
  # Wird ausgeführt, wenn Tests bestanden sind UND es main oder test ist
  condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/test'))
  jobs:
  - deployment: Push_Images_Staging
    displayName: 'Build & Push (staging)'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/test')
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: 'DockerHub-Connection'
          - script: |
              docker build \
                --build-arg VITE_GOOGLE_CLIENT_ID=$(GOOGLE_CLIENT_ID) \
                -t eduardgohl/budget-tracker-frontend:$(Build.BuildId) \
                -f app-frontend/Dockerfile app-frontend
              docker push eduardgohl/budget-tracker-frontend:$(Build.BuildId)
            displayName: 'Build & Push Frontend'
          - script: |
              docker build \
                -t eduardgohl/budget-tracker-backend:$(Build.BuildId) \
                -f backend/Dockerfile backend
              docker push eduardgohl/budget-tracker-backend:$(Build.BuildId)
            displayName: 'Build & Push Backend'

  - deployment: Push_Images_Prod
    displayName: 'Build & Push (production)'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: login
              containerRegistry: 'DockerHub-Connection'
          - script: |
          
              docker build \
                --build-arg VITE_GOOGLE_CLIENT_ID=$(GOOGLE_CLIENT_ID) \
                -t eduardgohl/budget-tracker-frontend:$(Build.BuildId) \
                -t eduardgohl/budget-tracker-frontend:latest \
                -f app-frontend/Dockerfile app-frontend
              docker push eduardgohl/budget-tracker-frontend:$(Build.BuildId)
              docker push eduardgohl/budget-tracker-frontend:latest
            displayName: 'Build & Push Frontend'
          - script: |
              docker build \
                -t eduardgohl/budget-tracker-backend:$(Build.BuildId) \
                -t eduardgohl/budget-tracker-backend:latest \
                -f backend/Dockerfile backend
              docker push eduardgohl/budget-tracker-backend:$(Build.BuildId)
              docker push eduardgohl/budget-tracker-backend:latest
            displayName: 'Build & Push Backend'


# ── STAGE 3: UPDATE MANIFEST REPO ─────────────────────────────────────────────
- stage: UpdateManifests
  displayName: 'Update Kubernetes Manifests'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: PatchImageTags
    displayName: 'Patch image tags via Kustomize'
    steps:
    - checkout: none
    - script: |
        # 1. Manifest-Repo klonen
        REPO_URL="https://$(MANIFEST_REPO_PAT)@dev.azure.com/edodevops0169/TackYourBudget/_git/app-manifests"
        git clone "$REPO_URL" manifests
        cd manifests

        # 2. Umgebung anhand des Branches bestimmen
        if [ "$(Build.SourceBranch)" == "refs/heads/main" ]; then
          OVERLAY_DIR="overlays/prod"
        elif [ "$(Build.SourceBranch)" == "refs/heads/test" ]; then
          OVERLAY_DIR="overlays/test"
        else
          echo "Kein valider Deployment-Branch. Abbruch."
          exit 0
        fi

        echo "Aktualisiere Manifeste in: $OVERLAY_DIR"
        cd $OVERLAY_DIR

        # 3. Kustomize nutzen statt sed
        kustomize edit set image eduardgohl/budget-tracker-frontend=eduardgohl/budget-tracker-frontend:$(Build.BuildId)
        kustomize edit set image eduardgohl/budget-tracker-backend=eduardgohl/budget-tracker-backend:$(Build.BuildId)

        # 4. Commit & Push
        cd ../..
        git config user.email "pipeline@testops"
        git config user.name "Azure Pipeline"
        git add $OVERLAY_DIR/kustomization.yaml
        git commit -m "chore: update $OVERLAY_DIR image tags to $(Build.BuildId) [skip ci]"
        git push
      displayName: 'Update image tags with Kustomize and push'
      env:
        MANIFEST_REPO_PAT: $(MANIFEST_REPO_PAT)